; Supervises the processes of the all-in-one image.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
; Every program inherits the environment prepared by entrypoint.sh.

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:executor]
priority=20
command=/srv/executor/.venv/bin/mobilerun-executor
directory=/srv/executor
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:app]
priority=30
command=/usr/local/bin/node /srv/app/server.js
directory=/srv/app
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; A process that keeps failing takes the container down, so the orchestrator
; restarts it instead of leaving a half-dead container running.
[eventlistener:shutdown]
command=/usr/local/bin/fatal-exit.sh
events=PROCESS_STATE_FATAL
autorestart=true
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
