# Production: one container with the executor and the app inside; MongoDB is
# external (e.g. Atlas), so MONGODB_URI is required.
#
#   MONGODB_URI='mongodb+srv://...' docker compose -f docker-compose.prod.yml up -d --build
#
# Phones must be reachable over network adb (`adb connect <ip>`) unless the host
# is Linux and you pass USB devices through; see docker/README.md.
services:
  mobilerun:
    build:
      context: .
      dockerfile: Dockerfile.aio
    image: mobilerun:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Optional: leave unset and the container generates one at start.
      EXECUTOR_TOKEN: ${EXECUTOR_TOKEN:-}
      # External MongoDB, e.g. mongodb+srv://user:pass@cluster.example.mongodb.net/
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI to your MongoDB connection string}
      MONGODB_DB: ${MONGODB_DB:-mobilerun}
      # The provider key for the models in /config/config.yaml.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - config:/config
    # USB phones on a Linux host: uncomment both lines.
    # privileged: true
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb

volumes:
  config:
