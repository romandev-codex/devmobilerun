# Production: one container with the executor and the app inside; MongoDB is
# external (e.g. Atlas), so MONGODB_URI is required.
#
#   MONGODB_URI='mongodb+srv://...' docker compose -f docker-compose.prod.yml up -d --build
#
# Phones: pick ONE of the options in the service below (see docker/README.md).
#
#   A. Network adb (any OS). Enable it once with the phone on USB, then connect
#      from the container:
#        adb tcpip 5555
#        docker exec mobilerun adb connect <phone-ip>:5555
#      Android 11+ can use Wireless debugging instead (`adb pair`, `adb connect`).
#
#   B. Host adb server (macOS, Windows, Linux). The phone stays on the host's USB
#      and the container talks to the host's adb server over TCP. Docker Desktop
#      on macOS/Windows cannot pass USB through, so this is the USB option there.
#      Start the host server listening on all interfaces (exposes adb to your
#      LAN; use a trusted network or a firewall rule):
#        macOS/Linux:  adb kill-server && adb -a nodaemon server start
#        Windows:      adb kill-server; adb -a nodaemon server start   (PowerShell;
#                      allow adb.exe through Windows Firewall when prompted)
#      Drop `nodaemon` and use `adb -a start-server` to run it in the background.
#
#   C. USB passthrough (Linux host only). Stop any adb server on the host first
#      (`adb kill-server`): only one process can hold the device.
services:
  mobilerun:
    build:
      context: .
      dockerfile: Dockerfile.aio
    image: mobilerun:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Optional: leave unset and the container generates one at start.
      EXECUTOR_TOKEN: ${EXECUTOR_TOKEN:-}
      # External MongoDB, e.g. mongodb+srv://user:pass@cluster.example.mongodb.net/
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI to your MongoDB connection string}
      MONGODB_DB: ${MONGODB_DB:-mobilerun}
      # The provider key for the models in /config/config.yaml.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Optional: enables the TypeSafe Jev agent.
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_MODEL: ${TYPESAFE_MODEL:-jev-latest}
      # --- Option B: host adb server (macOS / Windows / Linux) ---------------
      # The executor (async_adbutils) reads the first two; the `adb` CLI inside
      # the container (`docker exec mobilerun adb devices`) reads the third.
      # ANDROID_ADB_SERVER_HOST: host.docker.internal
      # ANDROID_ADB_SERVER_PORT: "5037"
      # ADB_SERVER_SOCKET: tcp:host.docker.internal:5037
    volumes:
      - config:/config
    # Option B on Linux only: Docker Desktop (macOS/Windows) already defines
    # host.docker.internal, plain Docker Engine on Linux needs this mapping.
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

    # --- Option C: USB passthrough (Linux host only) --------------------------
    # privileged: true
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb

volumes:
  config:
