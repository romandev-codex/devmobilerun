# Builds the all-in-one production image (Dockerfile.aio) and publishes it to
# the GitHub Container Registry of this repository.
#
# Manual only: start it from the Actions tab (or `gh workflow run docker.yml`).
# A run off main publishes :main, :sha-<short> and :latest; a run off a v* tag
# publishes :1.2.3, :1.2 and :latest.
name: Build and push the container 🐳

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        default: linux/amd64,linux/arm64

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# A newer run replaces an in-flight build of the same ref.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      # The hosted runner ships with ~14 GB free, which a two-arch build of this
      # image exhausts ("No space left on device"). Drop toolchains we never use.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell \
            /usr/share/swift /usr/local/julia* /opt/microsoft /opt/google /usr/lib/jvm
          sudo docker image prune --all --force
          sudo swapoff -a && sudo rm -f /mnt/swapfile /swapfile || true
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v5

      # arm64 is emulated. It roughly doubles the build time of this image, whose
      # Python dependency tree is large; drop it from the `platforms` input, or move
      # to a matrix over ubuntu-24.04-arm runners, if that becomes painful.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.aio
          push: true
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # mode=min keeps the cache well inside the 10 GB Actions cache budget;
          # this image is around 2 GB per architecture.
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: mode=max

      - name: Attest the published image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
